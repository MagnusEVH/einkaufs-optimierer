<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guthaben scannen – Einkaufs-Optimierer</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px 80px; color: #0f172a; line-height: 1.5; background: #f8fafc; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin: 14px 0; }
    .step { font-weight: 700; color: #065f46; margin-bottom: 6px; }
    .btn { display: inline-block; padding: 12px 16px; background: #059669; color: #fff; border: 0; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; text-decoration: none; }
    .btn.secondary { background: #e2e8f0; color: #0f172a; }
    .btn:disabled { opacity: .5; cursor: default; }
    .muted { color: #64748b; font-size: .88rem; }
    .warn { color: #b45309; font-weight: 600; }
    .big { font-size: 1.8rem; font-weight: 800; }
    progress { width: 100%; }
    img.preview { max-width: 100%; max-height: 360px; border-radius: 10px; margin-top: 8px; }
    details pre { white-space: pre-wrap; font-size: .8rem; background: #f1f5f9; padding: 8px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1 id="title">Guthaben scannen</h1>
  <p class="muted">Screenshot der Guthaben-Seite deiner Händler-App. Die Texterkennung läuft hier im Browser, das Bild verlässt dein Gerät nicht.</p>

  <div class="card">
    <div class="step">1. Screenshot wählen</div>
    <input type="file" id="file" accept="image/*">
    <p class="muted" id="hint"></p>
    <img id="preview" class="preview" alt="" hidden>
    <div id="ocrBox" hidden>
      <p id="ocrStatus" class="muted">Lade Texterkennung …</p>
      <progress id="ocrProgress" max="1" value="0"></progress>
    </div>
  </div>

  <div class="card">
    <div class="step">2. Erkannter Stand</div>
    <p id="result" class="muted">Noch kein Bild.</p>
    <details><summary class="muted">Erkannter Text</summary><pre id="text"></pre></details>
    <p style="margin-top:14px">
      <button class="btn" id="send" disabled>In App übernehmen</button>
      <a class="btn secondary" href="./">Zurück zur App</a>
    </p>
  </div>

  <script src="konto/parse.js"></script>
  <script>
    (function () {
      'use strict';
      var TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
      var PROGRAMS = {
        rewe: { name: 'REWE Bonus', kind: 'euro', hint: 'REWE-App öffnen, Startseite mit „Dein Bonus-Guthaben“ zeigen, Screenshot machen.' },
        payback: { name: 'PAYBACK', kind: 'points', hint: 'PAYBACK-App öffnen, der Punktestand steht ganz oben. Screenshot machen.' }
      };
      var $ = function (id) { return document.getElementById(id); };
      var programId = new URLSearchParams(location.search).get('program') || '';
      var program = PROGRAMS[programId];
      var found = null;

      if (!program) {
        $('result').innerHTML = '<span class="warn">Unbekanntes Programm. Bitte aus der App heraus öffnen.</span>';
        $('file').disabled = true;
        return;
      }
      $('title').textContent = program.name + ': Stand scannen';
      $('hint').textContent = program.hint + ' (iPhone: Seitentaste und Lauter-Taste gleichzeitig.)';

      function euro(c) { return (c / 100).toFixed(2).replace('.', ',') + ' €'; }
      function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); }

      function loadTesseract() {
        if (window.Tesseract) return Promise.resolve(window.Tesseract);
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = TESSERACT_URL;
          s.onload = function () { resolve(window.Tesseract); };
          s.onerror = function () { reject(new Error('Texterkennung konnte nicht geladen werden (Internet nötig)')); };
          document.head.appendChild(s);
        });
      }

      $('file').addEventListener('change', async function () {
        var file = this.files && this.files[0];
        if (!file) return;
        $('preview').src = URL.createObjectURL(file);
        $('preview').hidden = false;
        $('ocrBox').hidden = false;
        $('send').disabled = true;
        found = null;
        try {
          var T = await loadTesseract();
          var worker = await T.createWorker('deu', 1, {
            logger: function (m) {
              if (m.status === 'recognizing text') {
                $('ocrStatus').textContent = 'Lese Text …';
                $('ocrProgress').value = m.progress;
              } else {
                $('ocrStatus').textContent = 'Vorbereitung: ' + m.status;
              }
            }
          });
          var res = await worker.recognize(file);
          await worker.terminate();
          $('text').textContent = res.data.text;
          $('ocrStatus').textContent = 'Fertig.';
          $('ocrProgress').value = 1;
          found = KontoParser.parseBalance(res.data.text, program.kind);
          if (found) {
            var value = found.value_cents !== undefined ? euro(found.value_cents) + ' Guthaben' : found.points.toLocaleString('de-DE') + ' Punkte';
            $('result').innerHTML = '<span class="big">' + esc(value) + '</span><br><span class="muted">aus der Zeile „' + esc(found.line) + '“</span>';
            $('send').disabled = false;
          } else {
            $('result').innerHTML = '<span class="warn">Kein Stand gefunden. Bitte einen Screenshot wählen, auf dem Guthaben bzw. Punkte gut lesbar sind.</span>';
          }
        } catch (e) {
          $('ocrStatus').textContent = 'Fehler: ' + e.message;
        }
      });

      function toBase64Url(str) {
        var bytes = new TextEncoder().encode(str);
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }

      $('send').addEventListener('click', function () {
        if (!found) return;
        var payload = { v: 1, kind: 'balance', program: programId, value_cents: found.value_cents, points: found.points };
        // Daten gehen nur im Adressteil nach # an die App, nicht an einen Server
        location.href = new URL('./', location.href).href + '#import=' + toBase64Url(JSON.stringify(payload));
      });
    })();
  </script>
</body>
</html>
