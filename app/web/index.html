<!DOCTYPE html>
<html lang="de">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Intelligenter Einkaufs-Optimierer für Supermärkte & Drogerien">
  <meta name="theme-color" content="#059669">

  <!-- iOS PWA Meta Tags & Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Einkaufs-Opt.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Einkaufs-Optimierer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid #E2E8F0;
      border-top: 3.5px solid #059669;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
      color: #0F172A;
      letter-spacing: -0.2px;
    }
    #stuck {
      display: none;
      margin-top: 24px;
      max-width: 300px;
      text-align: center;
      font-size: 14px;
      color: #5E554A;
    }
    #stuck button {
      margin-top: 12px;
      padding: 12px 20px;
      border: 0;
      border-radius: 12px;
      background: #047857;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">Einkaufs-Optimierer lädt...</div>
    <div id="stuck">
      Das dauert ungewöhnlich lange. Oft hängt noch eine alte Version im Zwischenspeicher.
      <br><button type="button" id="stuck-reload">Zwischenspeicher leeren und neu laden</button>
    </div>
  </div>

  <script>
    // Notausgang: Startet die App nicht, Cache und Cache-Worker leeren und
    // neu laden. Lokale Daten (Liste, Einstellungen, Anmeldung) bleiben.
    var started = false;
    setTimeout(function () {
      if (started) return;
      var el = document.getElementById('stuck');
      if (el) el.style.display = 'block';
    }, 15000);
    document.getElementById('stuck-reload').addEventListener('click', function () {
      var jobs = [];
      if ('serviceWorker' in navigator) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches) {
        jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }));
      }
      Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
    });

    window.addEventListener('flutter-first-frame', function () {
      started = true;
      const el = document.getElementById('loading-container');
      if (el) {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 400);
      }
    });
  </script>

  <script>
    // Eigener Cache für schnelle Starts vom Home-Bildschirm (siehe sw.js)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <!-- Guthaben-Scan in der App (klein; die Texterkennung lädt erst bei Bedarf) -->
  <script src="konto/parse.js" defer></script>
  <script src="konto/scan.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
