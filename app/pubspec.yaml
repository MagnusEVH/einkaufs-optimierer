name: einkaufs_optimierer
description: Einkaufs-Optimierer für Lidl, Aldi und Rewe mit PostGIS-Clustering und Routing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6
  geolocator: ^12.0.0
  # google_maps_flutter wird erst eingebunden wenn Android-/iOS-Build erfolgt.
  # Für Web-Demo wird die Kartenansicht durch eine ListView ersetzt.
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  uuid: ^4.4.0
  http: ^1.2.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/products_seed_250.json
    - assets/sample_stores_germany.json
    - assets/sample_offers_and_wallet.json
    - assets/live_scraped_offers_rlp.json
