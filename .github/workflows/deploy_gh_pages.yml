name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend Tests
        run: |
          set -e
          for t in backend_tests/*.js; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done

      - name: RLS-Tests (Supabase-Migrationen in PGlite)
        working-directory: supabase/tests
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Tests
        run: |
          cd app
          flutter pub get
          flutter test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Flutter Web
        run: |
          cd app
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          flutter build web --release --wasm --base-href "/${REPO_NAME}/" \
            --dart-define=CARTO_API_KEY=${{ secrets.CARTO_API_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app/build/web'
          # Eindeutiger Name pro Versuch: Bei "Re-run" bleiben die Artefakte
          # früherer Versuche erhalten, sonst bricht deploy-pages ab.
          name: github-pages-${{ github.run_attempt }}

  # Eigener Job: Direkt nach dem Upload im selben Job findet deploy-pages
  # das Artefakt manchmal noch nicht ("Found 0 artifact(s)").
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
