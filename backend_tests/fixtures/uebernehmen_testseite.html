<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Testseite Angebote (synthetisch)</title></head>
<body>
  <!-- Synthetische Seite: nachgebaute Struktur, keine echten Händlerdaten -->
  <header><nav><a href="#">Startseite</a> <span>Versand ab 3,90 €</span></nav></header>
  <h1>Angebote in deinem Markt</h1>
  <p>Gültig vom 24.11. bis 29.11.</p>

  <!-- Karte im Stil "Supermarkt A": Preis und Streichpreis getrennt -->
  <div class="grid">
    <article class="tile">
      <img src="data:," alt="">
      <div class="badge">-25%</div>
      <div class="brand">Kerrygold</div>
      <div class="name">Kerrygold Irische Butter 250g</div>
      <div class="grammage">250 g (1 kg = 7,96 €)</div>
      <div class="price-row"><span class="price">1,99 €</span> <span class="old">statt 2,65 €</span></div>
      <button>In den Warenkorb</button>
    </article>
    <article class="tile">
      <img src="data:," alt="">
      <div class="name">Bananen</div>
      <div class="grammage">je 1 kg</div>
      <div class="price-row"><span class="price">1,29 €</span></div>
    </article>
  </div>

  <!-- Karte im Stil "Discounter B": Punkt als Trenner, Sternchen, Preise ohne Label -->
  <ul class="products">
    <li class="product">
      <figure><img src="data:," alt=""></figure>
      <h3>Somat Gold Spülmaschinentabs 40 Stück</h3>
      <div class="pricebox"><span class="was">5.49</span> <span class="now">3.99*</span></div>
    </li>
  </ul>

  <footer><p>* Preise inkl. MwSt.</p></footer>
</body>
</html>
